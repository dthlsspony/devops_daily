name: security-digest-bot

# Общие настройки runtime-сервисов. Контейнер стартует от root только для того,
# чтобы entrypoint отдал каталог данных пользователю appuser; сам сервис
# работает от appuser.
x-common-runtime: &common-runtime
  image: security-digest-bot:runtime
  env_file:
    - path: .env
      required: false
  # Контейнер стартует от root только для того, чтобы entrypoint отдал каталог
  # данных пользователю appuser; сам сервис работает от appuser.
  user: "0:0"
  # tini становится PID 1 и пробрасывает сигналы. Иначе SIGTERM, пришедший
  # раньше, чем Python поставит обработчик, молча игнорируется (PID 1).
  init: true
  environment:
    # Внутри контейнера порт фиксирован; HEALTH_PORT из .env задаёт порт на хосте.
    TZ: UTC
    HEALTH_HOST: 0.0.0.0
    HEALTH_PORT: 8080
  volumes:
    - ./data:/app/data
  restart: unless-stopped
  # Идущий цикл должен успеть завершиться при остановке (docker compose stop).
  stop_grace_period: 120s

x-common-tools: &common-tools
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: dev
  image: security-digest-bot:dev
  profiles: ["tools"]
  environment:
    TZ: UTC
    PYTHONPATH: /app/src
    # Кэши инструментов остаются в контейнере, а не в каталоге проекта.
    MYPY_CACHE_DIR: /tmp/mypy-cache
    RUFF_CACHE_DIR: /tmp/ruff-cache
    PYTEST_ADDOPTS: -o cache_dir=/tmp/pytest-cache
  volumes:
    - .:/app
  working_dir: /app

services:
  # Основной сервис: планировщик раз в SCHEDULE_HOURS + health-эндпоинт.
  # Единственный сервис, который собирает runtime-образ (once и dry-run его переиспользуют).
  bot:
    <<: *common-runtime
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    ports:
      - "${HEALTH_PORT:-8080}:8080"
    command: ["python", "-m", "digest_bot", "run"]

  # Разовый прогон рабочего цикла (публикация в Telegram).
  once:
    <<: *common-runtime
    profiles: ["oneshot"]
    restart: "no"
    command: ["python", "-m", "digest_bot", "run", "--once"]

  # Разовый прогон без GigaChat и Telegram: только показать собранное.
  dry-run:
    <<: *common-runtime
    profiles: ["oneshot"]
    restart: "no"
    command: ["python", "-m", "digest_bot", "run", "--dry-run"]

  # Инструменты разработки. Команда передаётся аргументом:
  #   docker compose --profile tools run --rm tools pytest -q
  tools:
    <<: *common-tools
    command:
      - sh
      - -c
      - "ruff check src tests && ruff format --check src tests && mypy src tests && pytest -q"
